<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV HP</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  video {
    position: absolute;
    left: -9999px;
    top: -9999px;
  }
  #canvas-capture {
    display: none;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #e5e5e5;
  }
  button {
    padding: 14px 32px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  button:disabled {
    background: #333;
    color: #777;
  }
  #status {
    margin-top: 20px;
    font-size: 13px;
    color: #888;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>

<h1>CCTV HP</h1>
<button id="toggleBtn" disabled>Memuat...</button>
<div id="status">Menyiapkan model deteksi</div>

<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas-capture"></canvas>

<script>
const video = document.getElementById('camera');
const captureCanvas = document.getElementById('canvas-capture');
const statusEl = document.getElementById('status');
const toggleBtn = document.getElementById('toggleBtn');

let model = null;
let streaming = false;
let detectIntervalId = null;
let snapshotIntervalId = null;
let lastKnownLocation = null; // { lat, lng, accuracy }

const SNAPSHOT_INTERVAL_MS = 3000;  // kirim foto rutin tiap 3 detik
const DETECT_INTERVAL_MS = 1000;    // cek orang tiap 1 detik, kirim tiap kali ketemu

async function loadModel() {
  try {
    model = await cocoSsd.load();
    statusEl.textContent = "Siap. Tekan Mulai untuk mengaktifkan kamera dan lokasi.";
    toggleBtn.textContent = "Mulai";
    toggleBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = "Gagal memuat model: " + err.message;
  }
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" } },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(resolve => { video.onloadedmetadata = resolve; });
}

function startLocationWatch() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve();
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        lastKnownLocation = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
        resolve();
      },
      (err) => {
        console.error("Gagal ambil lokasi:", err.message);
        resolve();
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );

    navigator.geolocation.watchPosition(
      (pos) => {
        lastKnownLocation = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
      },
      (err) => console.error("Gagal update lokasi:", err.message),
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
    );
  });
}

function captureFrame() {
  captureCanvas.width = video.videoWidth;
  captureCanvas.height = video.videoHeight;
  const ctx = captureCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
  return captureCanvas.toDataURL('image/jpeg', 0.7);
}

function buildLocationText() {
  if (!lastKnownLocation) return "Lokasi: tidak tersedia";
  const { lat, lng, accuracy } = lastKnownLocation;
  const akurasi = accuracy ? ` (akurasi ±${Math.round(accuracy)}m)` : "";
  return `Koordinat: ${lat.toFixed(6)}, ${lng.toFixed(6)}${akurasi}\nMaps: https://maps.google.com/?q=${lat},${lng}`;
}

function sendToTelegram(imageDataUrl, caption) {
  const payload = { image: imageDataUrl };
  if (caption) payload.caption = caption;

  fetch('/.netlify/functions/send-snapshot', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(err => console.error(err));
}

function sendLocationToTelegram() {
  if (!lastKnownLocation) return;
  const { lat, lng } = lastKnownLocation;

  fetch('/.netlify/functions/send-location', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lat, lng })
  }).catch(err => console.error(err));
}

// loop 1: kirim snapshot biasa tiap SNAPSHOT_INTERVAL_MS, dengan info lokasi di caption
function startSnapshotLoop() {
  snapshotIntervalId = setInterval(() => {
    if (!streaming || !video.videoWidth) return;
    const imageDataUrl = captureFrame();
    const caption = buildLocationText();
    sendToTelegram(imageDataUrl, caption);
  }, SNAPSHOT_INTERVAL_MS);
}

// loop 2: cek orang tiap DETECT_INTERVAL_MS, kirim alert + lokasi SETIAP KALI ketemu
async function runDetection() {
  if (!streaming || !video.videoWidth) return;

  const predictions = await model.detect(video);
  const people = predictions.filter(p => p.class === 'person' && p.score > 0.6);

  if (people.length > 0) {
    const imageDataUrl = captureFrame();
    const caption = `ADA ORANG TERDETEKSI‼️‼️\n${buildLocationText()}`;

    sendToTelegram(imageDataUrl, caption);
    sendLocationToTelegram();

    statusEl.textContent = `Orang terdeteksi! Alert terkirim ${new Date().toLocaleTimeString('id-ID')}`;
  } else {
    statusEl.textContent = `Monitoring aktif... (${new Date().toLocaleTimeString('id-ID')})`;
  }
}

function startDetectLoop() {
  detectIntervalId = setInterval(runDetection, DETECT_INTERVAL_MS);
}

toggleBtn.addEventListener('click', async () => {
  if (!streaming) {
    toggleBtn.disabled = true;
    statusEl.textContent = "Meminta izin kamera dan lokasi...";
    try {
      await startCamera();
      await startLocationWatch();
      streaming = true;
      toggleBtn.textContent = "Berhenti";
      toggleBtn.disabled = false;
      startDetectLoop();
      startSnapshotLoop();
      statusEl.textContent = "Monitoring aktif...";
    } catch (err) {
      statusEl.textContent = "Gagal akses kamera: " + err.message;
      toggleBtn.disabled = false;
      toggleBtn.textContent = "Mulai";
    }
  } else {
    streaming = false;
    clearInterval(detectIntervalId);
    clearInterval(snapshotIntervalId);
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
    }
    toggleBtn.textContent = "Mulai";
    statusEl.textContent = "Dihentikan";
  }
});

loadModel();
</script>

</body>
</html>
